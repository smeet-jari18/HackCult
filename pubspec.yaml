
name: life_mitra
description: LiFE Mitra Gujarat - Mission LiFE Citizen Engagement App (HC26-GEDA01). Flutter frontend (mobile + web admin).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  firebase_auth: ^5.6.2
  firebase_core: ^3.15.1
  firebase_storage: ^12.4.10
  go_router: ^14.2.7
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.3

  # Photo / bill proof capture (camera + gallery)
  image_picker: ^1.1.2

  # Supabase backend (Postgres + Auth + Storage + Realtime)
  supabase_flutter: ^2.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
