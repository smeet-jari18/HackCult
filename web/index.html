<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LiFE Mitra Gujarat — Mission LiFE citizen app & GEDA admin portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="life_mitra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>LiFE Mitra Gujarat</title>
  <meta name="google-signin-client_id" content="983072556271-5piiu6gfphbvf3moj1ss2kn396oncr2k.apps.googleusercontent.com">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin:0; height:100%; background:#F0FDF3; }
    #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#F0FDF3; transition:opacity .35s ease; z-index:9999; }
    #splash img { width:min(46vw, 220px); height:auto; animation:pulse 1.6s ease-in-out infinite; }
    #splash p { margin-top:18px; font:500 14px/1.4 Inter, system-ui, sans-serif; color:#1B5E20; letter-spacing:.2px; }
    @keyframes pulse { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(1.04); opacity:.92 } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-512.png" alt="LiFE Mitra Gujarat"><p>Loading LiFE Mitra Gujarat…</p></div>
  <script>
    // Hide the HTML splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (!s) return;
      s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
